#-------------------------------------attention-----------------------------------------------
enemy: "blue"
listen_game_status: true  # if true, 0x0212 combined data only sends when game_process == 4 (match in progress)
#-------------------------------------attention-----------------------------------------------
sigma_q_x: 50.0
sigma_q_y: 50.0
sigma_r_x: 0.1
sigma_r_y: 0.1

# 关联门限的基础半径(m)。实际门限 = distance_threshold + v * dt，
# v 是轨迹当前预测速度，快速目标自动获得更大的门限。
distance_threshold: 0.8

# 关联代价里对未成熟轨迹的惩罚(m)。匈牙利求全局最优时会用"离得近"的新轨迹
# 顶掉已收敛的轨迹，加这个惩罚让成熟轨迹优先，减少 ID 重建。
# 设为 0 即退化为纯距离代价。
immature_penalty: 0.3

# 轨迹多久没关联成功就删除(s)。代码真正读这个键（以前只写在注释里，实际用的是
# 代码里写死的 1.5，容易误导）。调大 = 更耐遮挡但更容易留下幽灵轨迹。
TIME_THRESHOLD: 1.5

# 一个 id 的现任轨迹"多久没关联成功"就让位(s)。默认 1.5 等于 TIME_THRESHOLD，
# 也就是轨迹会先被删掉，于是这条规则实际不生效——归属一直跟着轨迹活：
# 只要现任轨迹还在被持续追踪（哪怕装甲板一直没识别出来、多数表决早就失败），
# 这个 id 就一直由它上报，别的轨迹夺不走；只有轨迹被删（1.5s 无观测）才释放。
# 调小它（如 0.5）就回到"跑丢 0.5s 就把 id 让给别的轨迹"的老行为。
id_yield_time: 1.5

# 现任者要"通吃"一个 id，它在最近 10 帧窗口里至少要有这么多票（= 最近 1s 内至少
# 有一次确认识别到这个 id）。
#
# 为什么需要这一条："位置被车体观测持续更新"和"身份有证据"是两回事。场地中央一个
# 假目标会被车体网络持续检出（观测全是 class_id=-1），它的轨迹一直活着、hits 一直涨，
# 但窗口里的票数会衰减到 0。旧规则只要轨迹活着就让它永远占着 id —— 实测一局里蓝3
# 被按在场地中央 38s（票数全程 0），真蓝3 带着满票申请了 38s 一次都没抢回来，最后
# 真蓝3 的 id 一直冻结在一个错误位置上；id 7 上同样的事持续了 100s 以上。
#
# 现在：票数 >= 这个值才通吃；0 票 = 身份完全没证据，这时只要有别的轨迹能正经认领
# （多数表决 + min_id_evidence，且这一帧真收到了观测），就该让位。日志里的 IDTAKE
# 就是这样一次"僵尸回收"。
#
# 注意它不影响"装甲板看不见但车体还在被跟踪"的 id 维护（日志里的 HOLD）：那种情况下
# 没有任何别的轨迹能认领这个 id，现任者照样继续报，一帧都不会掉。
#
# 0 = 恢复旧行为（现任者永不放手），会在上面那种误识别下把 id 永久锁死在错误位置上。
# 调大（如 3）会让现任者更容易被夺走，正常情况下没必要。
min_hold_evidence: 1

# 一辆车进入真盲区（完全没观测）后，轨迹会在 TIME_THRESHOLD 后被删。这个参数决定
# 被删之后"冻结的最后位置"还能发多久（s）：-1 = 不设上限，只要该 id 没被重新识别
# 出来就一直发。任何正数都变成有上限，过期后该 id 才会真的从输出里消失（IDGONE）。
#
# 为什么要冻结而不是让它消失：下游拿不到某个 id 会把坐标写成 (0,0)，而 (0,0) 在赛场
# 坐标系里是个看起来完全正常的点，接收方分不出"无数据"。
# 冻结位置的误差上限是 TIME_THRESHOLD 的滑行距离（快车 4~5m），但冻结之后误差不再
# 增长——这是"冻结"相对"继续外推"的全部意义，也是一个固定存在的偏差。
# 不设上限时，赛场上可能有车早已开走或被打掉，位置却一直发着（实测一局有 28 段
# 盲区 >15s、最长 200s）。看日志汇总行里的 ghost_max_age 决定要不要回来加上限。
blind_hold_time: -1.0

# 一条轨迹要认领一个 id，最近窗口里至少要有这么多票（窗口 10 格，还要过半）。
# 设为 1 时一条从单帧垃圾观测建起来的轨迹第一帧就能认领 id（IDNEW conf=0.1 那种）；
# 3 表示要连续 3 帧（0.3s）认同一个 id，代价是第一次上报晚 2 帧。
# 有现任者时这条无所谓（现任者通吃），它真正防的是"原轨迹已死、id 靠冻结位置维持"
# 时被一个随机位置的垃圾轨迹顶掉。
min_id_evidence: 3

# 诊断日志开关。打开后每帧打印一行 [TRK] 汇总，以及本帧发生的事件：
#   MISS    观测不在门限内（门限问题）—— 后面跟着最近观测离多远、门限多大
#   LOST    观测在门限内但被别的轨迹抢走了（关联问题）—— 后面跟着 taken_by
#   SPAWN   为未匹配观测新建轨迹
#   DELETE  轨迹超时被删除 —— 看 coast 有多久、hits 多少
#   IDNEW/IDSW/IDGONE  id 第一次上报 / 换轨迹上报（含 trk N->0 / 0->N，
#           即冻结接管与真轨迹接回）/ 连冻结位置都没了
#   HOLD    这个 id 靠"现任者通吃"上报（多数表决已经失败，装甲板看不见但车体还在被
#           跟踪）—— held= 是距上一次多数表决确认过了多久，coast= 是本轨迹多久没关联
#   IDTAKE  现任者被夺走：它已经零证据（min_hold_evidence），而另一条这一帧真收到
#           观测的轨迹正经认领了这个 id —— 后面跟着旧现任的票数/hits/占了多久
#           （held=）、它的位置，以及新主人的位置。这就是"真车把 id 从误识别手里
#           拿回来"那一帧。同一次夺走会连续打若干行（每帧都算一次），所以看行数要
#           先看有没有连续，别把一次 4 秒的夺走数成 40 次
#   GHOST   轨迹已死，发的是冻结的最后位置 —— age= 是这个位置有多陈旧
#   MULTIID 一条轨迹的历史里混进了多个 id（交叉时抢了别人的观测），
#           MULTIID 只看单条轨迹内部，跨轨迹抢同一个 id 看下面的 IDCONFLICT
#   IDCONFLICT 同一个 id 这一帧有两条以上轨迹能上报，后面跟着各候选的票数/hits/
#           跑丢时间、现任（如果它已经被判定让位），以及最终赢家
# 汇总行里 hold= / take= / ghost= 分别是本帧靠持有上报、被夺走、冻结补报的 id 数。
# 还带本帧观测的上游置信度分布（CLSCONF_HIST / CARCONF_HIST），
# 用来选 min_class_confidence / min_car_confidence，目前只记录不拦截。
# 比赛时务必保持 false，日志会以 10Hz 刷屏。
debug_tracker: false

# 诊断日志文件。开头的 ~ 展开成 $HOME。每次启动覆盖重写，每帧 flush
# （中途 Ctrl+C 也不会丢最后一段），写到 64MB 自动停止写文件（终端照常输出）。
# 终端和文件是同一份内容，可以边跑边看终端。
debug_log_path: "~/decision_run.log"