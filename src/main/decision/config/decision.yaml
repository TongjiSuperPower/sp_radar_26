#-------------------------------------attention-----------------------------------------------
enemy: "blue"
listen_game_status: true  # if true, 0x0212 combined data only sends when game_process == 4 (match in progress)
#-------------------------------------attention-----------------------------------------------
sigma_q_x: 50.0
sigma_q_y: 50.0
sigma_r_x: 0.1
sigma_r_y: 0.1

# 关联门限的基础半径(m)，实际门限 = distance_threshold + v * dt（快目标自动放宽）
distance_threshold: 0.8

# 关联代价里对未成熟轨迹的惩罚(m)：让匈牙利优先保住已收敛的轨迹。0 = 纯距离代价。
immature_penalty: 0.3

# 轨迹多久没关联成功就删除(s)。调大 = 更耐遮挡，但更容易留下幽灵轨迹。
TIME_THRESHOLD: 1.5

# 一个 id 的现任轨迹多久没关联成功就让位(s)。默认 1.5 = TIME_THRESHOLD，轨迹会先被删掉，
# 所以这条实际不生效：归属一直跟着轨迹活（只要它还在被追踪，别的轨迹就夺不走，哪怕装甲板
# 一直没识别出来）。调小（如 0.5）即回到"跑丢一段时间就把 id 让给别人"。
id_yield_time: 1.5

# 现任者要"通吃"一个 id，最近 10 帧窗口里至少要有这么多票（1 = 最近 1s 内至少确认过一次）。
# "位置被持续更新"和"身份有证据"是两回事：场地中央的假目标会被车体网络持续检出（观测全是
# class_id=-1），票数衰减到 0 却一直占着 id，真车带满票也抢不回来。零票时让位（日志里的
# IDTAKE）；没人认领时现任者照样继续报，所以 HOLD（装甲板看不见但车体跟得住）不受影响。
# 0 = 永不放手，会把 id 锁死在误识别上；调大（如 3）正常情况下没必要。
min_hold_evidence: 1

# 真盲区（完全没观测）里轨迹被删之后，"冻结的最后位置"还能发多久(s)：-1 = 不设上限。
# 冻结而不是让它消失，是因为下游拿不到某个 id 会把坐标写成 (0,0)，那在赛场坐标系里看着
# 完全正常。误差上限是 TIME_THRESHOLD 的滑行距离（快车 4~5m），但冻结之后不再增长。
# 不设上限意味着车早开走了位置还在发（实测最长 200s），看汇总行的 ghost_max_age 决定
# 要不要设成正数。
blind_hold_time: -1.0

# 从零认领一个 id 需要窗口里至少有这么多票（窗口 10 格且要过半）。1 时从单帧垃圾观测建起来
# 的轨迹第一帧就能认领（会顶掉靠冻结位置维持的 id）；3 = 连续 3 帧认同一个身份，代价是
# 首次上报晚 2 帧。有现任者时这条无所谓（现任者通吃）。
min_id_evidence: 3

# 诊断日志开关。打开后每帧一行 [TRK] 汇总（car/ trk/ match/ spawn/ del/ out/ hold/ take/
# ghost/ ghost_max_age/ clsconf_*/ carconf_*），以及本帧发生的事件：
#   MISS/LOST   观测不在门限内 / 在门限内被别的轨迹抢走（跟最近观测的距离和 taken_by）
#   SPAWN/DELETE  新建轨迹 / 超时删除（看 coast、hits）
#   IDNEW/IDSW/IDGONE  某 id 第一次上报 / 换了轨迹上报（含冻结接管 trk N->0、真轨迹接回
#               0->N）/ 连冻结位置都没了
#   HOLD        靠现任者通吃上报（多数表决已失败），held= 距上次多数表决确认过了多久
#   IDTAKE      现任者零证据被夺走，即"真车把 id 从误识别手里拿回来"那一帧。同一次夺走
#               每帧都打一行，别把连续的行数当成次数
#   GHOST       发的是冻结的最后位置，age= 有多陈旧
#   MULTIID     单条轨迹内部混了多个 id（跨轨迹抢同一个 id 看 IDCONFLICT）
#   IDCONFLICT  同一帧有多条轨迹能上报同一个 id（跟各候选的票数/hits/跑丢时间和赢家）
# CLSCONF_HIST / CARCONF_HIST 是上游置信度分布，目前只记录不拦截（用来选阈值）。
# 比赛时务必保持 false，日志会以 10Hz 刷屏。
debug_tracker: false

# 诊断日志文件。开头的 ~ 展开成 $HOME。每次启动覆盖重写、每帧 flush（Ctrl+C 不丢尾部），
# 写到 64MB 停止写文件（终端照常输出）。终端和文件是同一份内容。
debug_log_path: "~/decision_run.log"
